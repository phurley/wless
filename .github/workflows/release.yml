name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          allow-missing-changelog: true
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wless
          target: ${{ matrix.target }}
          archive: wless-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    needs: build
    runs-on: ubuntu-latest
    # A failure here (e.g. the tap token isn't configured yet) shouldn't
    # mark the whole release as failed -- the actual binaries above are
    # what matters most, this is a nice-to-have sync.
    continue-on-error: true
    steps:
      - name: Checkout wless (for the generator script)
        uses: actions/checkout@v4

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: phurley/homebrew-wless
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate formula
        run: python3 .github/scripts/update_homebrew_formula.py "${{ github.ref_name }}" tap/Formula/wless.rb

      - name: Commit and push if changed
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wless.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
          else
            git commit -m "wless ${{ github.ref_name }}"
            git push
          fi
