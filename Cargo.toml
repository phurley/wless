[package]
name = "wless"
version = "1.0.0"
edition = "2024"
description = "A word-wrapping, auto-following pager"
license = "MIT"
repository = "https://github.com/phurley/wless"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
memchr = "2.8.3"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
ratatui = "0.30.2"
regex = "1.13.1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
